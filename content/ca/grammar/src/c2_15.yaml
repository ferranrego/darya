id: "c2_15"
title: "Marcadors discursius per a l'assaig i l'oratòria"
subtitle: "altrament, en darrer terme, a tall de conclusió"
grammarPoint: "Connectors i organitzadors textuals avançats"
grammarPointEn: "Discourse markers for essays and public speaking"
slides:
  - id: "c2_15_s1"
    title: "Marcadors de transició i contrast"
    body: "En textos acadèmics i discursos formals, s'utilitzen marcadors avançats com 'altrament' (en cas contrari, d'altra manera) o 'això no obstant' (tot i això) per introduir contrastos elegants i matisar l'argumentació."
    examples:
      - target: "S'han de prendre mesures dràstiques; altrament, el problema s'agreujarà."
        translit: ""
        en: "Drastic measures must be taken; otherwise, the problem will worsen."
        highlight: "altrament"
      - target: "Els resultats són prometedors; això no obstant, cal més recerca."
        translit: ""
        en: "The results are promising; nevertheless, more research is needed."
        highlight: "això no obstant"
  - id: "c2_15_s2"
    title: "Marcadors d'ordenació i jerarquització"
    body: "Per estructurar els arguments, fem servir expressions com 'd'entrada', 'en primer terme', 'en darrer terme' o 'en última instància'. Aquests connectors donen fluïdesa i coherència lògica al discurs."
    examples:
      - target: "En darrer terme, la responsabilitat recau sobre el comitè."
        translit: ""
        en: "Ultimately, the responsibility falls on the committee."
        highlight: "En darrer terme"
      - target: "En última instància, la decisió serà col·legiada."
        translit: ""
        en: "In the last instance, the decision will be collegial."
        highlight: "En última instància"
  - id: "c2_15_s3"
    title: "Marcadors de conclusió i síntesi"
    body: "Per tancar un discurs o un article assagístic amb solemnitat, es poden utilitzar fórmules com 'a tall de conclusió', 'en resolució', 'a manera de resum' o 'en definitiva'."
    examples:
      - target: "A tall de conclusió, podem afirmar que l'experiment ha estat un èxit."
        translit: ""
        en: "By way of conclusion, we can state that the experiment has been a success."
        highlight: "A tall de conclusió"
      - target: "En resolució, no hi ha cap motiu per al pessimisme."
        translit: ""
        en: "In short / in conclusion, there is no reason for pessimism."
        highlight: "En resolució"
exercises:
