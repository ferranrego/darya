id: "c1_03"
title: "Condicionals mixtes i alternatives a 'si'"
subtitle: "Posat que, tret que i combinacions de temps"
grammarPoint: "Condicionals mixtes i nexes alternatius"
grammarPointEn: "Mixed Conditionals and Alternatives to 'si'"
slides:
  - id: "s1"
    title: "Condicionals Mixtes"
    body: "Combinen una condició en el passat amb una conseqüència en el present o futur (o a la inversa). Permeten parlar de l'efecte actual d'esdeveniments irreals del passat."
    examples:
      - target: "Si hagués acabat la carrera, ara treballaria d'advocat."
        translit: ""
        en: "If I had finished my degree, I would be working as a lawyer now."
      - target: "Si no fos tan tímid, ahir t'hauria demanat de sortir."
        translit: ""
        en: "If I wasn't so shy, I would have asked you out yesterday."
  - id: "s2"
    title: "Alternatives a 'si': Tret que / A menys que"
    body: "El nexe 'tret que' estableix una condició negativa indispensable per no dur a terme una acció principal. Es pot intercanviar per 'a menys que' i porta sempre el verb en subjuntiu."
    examples:
      - target: "No vindré a la festa tret que m'ho demanis tu personalment."
        translit: ""
        en: "I won't come to the party unless you ask me personally."
      - target: "Sempre obren al matí, a menys que sigui un dia festiu."
        translit: ""
        en: "They always open in the morning, unless it's a holiday."
  - id: "s3"
    title: "Alternatives a 'si': Posat que / En cas que"
    body: "Substitueixen el 'si' en situacions que s'expressen de manera més hipotètica o formal. Tant 'posat que' com 'en cas que' van sempre acompanyats del mode subjuntiu."
    examples:
      - target: "Posat que guanyessis la loteria, què faries?"
        translit: ""
        en: "Assuming you won the lottery, what would you do?"
      - target: "Agafa el paraigua en cas que plogui més tard."
        translit: ""
        en: "Take the umbrella in case it rains later."
exercises:
  - id: "e1"
    type: "fillBlank"
    target: "Si ahir ___ anat a dormir d'hora, ara no estaria tan cansat."
    translit: ""
    en: "If I had gone to sleep early yesterday, I wouldn't be so tired now."
    answer:
      target: "hagués"
      translit: ""
    distractors:
      - target: "hauria"
        translit: ""
      - target: "hagi"
        translit: ""
  - id: "e2"
    type: "fillBlank"
    target: "Sortirem a passejar a la tarda ___ que plogui."
    translit: ""
    en: "We will go for a walk in the afternoon unless it rains."
    answer:
      target: "tret"
      translit: ""
    distractors:
      - target: "posat"
        translit: ""
      - target: "cas"
        translit: ""
  - id: "e3"
    type: "fillBlank"
    target: "___ que demà fes bon temps, on aniríem d'excursió?"
    translit: ""
    en: "Assuming the weather were good tomorrow, where would we go hiking?"
    answer:
      target: "Posat"
      translit: ""
    distractors:
      - target: "Tret"
        translit: ""
      - target: "Llevat"
        translit: ""
  - id: "e4"
    type: "fillBlank"
    target: "Si ella fos més responsable, no ___ comès aquest error ahir."
    translit: ""
    en: "If she were more responsible, she wouldn't have made this mistake yesterday."
    answer:
      target: "hauria"
      translit: ""
    distractors:
      - target: "hagués"
        translit: ""
      - target: "haurà"
        translit: ""
  - id: "e5"
    type: "fillBlank"
    target: "Truca'm en cas que ___ ajuda amb la instal·lació de l'ordinador."
    translit: ""
    en: "Call me in case you need help installing the computer."
    answer:
      target: "necessitis"
      translit: ""
    distractors:
      - target: "necessites"
        translit: ""
      - target: "necessitaràs"
        translit: ""
