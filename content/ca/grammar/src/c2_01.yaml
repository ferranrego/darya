id: c2_01
title: "El pronom 'ho' com a comodí oracional"
subtitle: "Substitució d'oracions senceres i atributs"
grammarPoint: "El pronom ho"
grammarPointEn: "The pronoun 'ho'"
slides:
  - id: c2_01_s1
    title: "Substitució d'oracions"
    body: |
      El pronom **ho** pot substituir tota una oració subordinada substantiva que fa de complement directe.
    examples:
      - target: "M'ha dit que vindrà tard, però no m'ho crec."
        translit: ""
        en: "He told me he will come late, but I don't believe it."
        highlight: "ho"
      - target: "Sabien que era perillós? Sí, ho sabien."
        translit: ""
        en: "Did they know it was dangerous? Yes, they knew it."
        highlight: "ho"
  - id: c2_01_s2
    title: "L'atribut indeterminat"
    body: |
      S'utilitza **ho** per substituir un atribut quan aquest està format per un adjectiu, un sintagma preposicional o un substantiu sense determinant.
    examples:
      - target: "Són metges? Sí que ho són."
        translit: ""
        en: "Are they doctors? Yes, they are."
        highlight: "ho"
      - target: "Sembla cansat. Realment ho sembla."
        translit: ""
        en: "He seems tired. He really seems it."
        highlight: "ho"
  - id: c2_01_s3
    title: "Atributs determinats vs. indeterminats"
    body: |
      Si l'atribut és determinat (porta article definit o demostratiu), es substitueix pels pronoms **el, la, els, les**. Si és indeterminat, per **ho**.
    examples:
      - target: "És el director? Sí, l'és."
        translit: ""
        en: "Is he the director? Yes, he is."
        highlight: "l'"
      - target: "És director? Sí, ho és."
        translit: ""
        en: "Is he a director? Yes, he is."
        highlight: "ho"
