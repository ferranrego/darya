id: "c1_04"
title: "El subjuntiu en oracions independents"
subtitle: "Expressant desig, dubte i emoció"
grammarPoint: "Tant de bo, potser, mal llamp i altres expressions"
grammarPointEn: "Subjunctive in Independent Clauses"
slides:
  - id: "s1"
    title: "Expressar Desig: Tant de bo"
    body: "La locució 'tant de bo' serveix per expressar un desig o una esperança. Sempre va acompanyada del verb en mode subjuntiu, sigui en temps present o passat."
    examples:
      - target: "Tant de bo faci bon temps demà."
        translit: ""
        en: "I hope the weather is good tomorrow."
      - target: "Tant de bo hagués estudiat una mica més."
        translit: ""
        en: "I wish I had studied a bit more."
  - id: "s2"
    title: "Expressar Dubte o Probabilitat"
    body: "La construcció 'pot ser que' exigeix sempre subjuntiu per expressar probabilitat. D'altra banda, adverbis o locucions com 'tal vegada' o 'tal volta' sovint s'usen amb subjuntiu quan indiquen un grau elevat de dubte."
    examples:
      - target: "Pot ser que arribin tard a la reunió."
        translit: ""
        en: "They may arrive late to the meeting."
      - target: "Tal vegada la decisió sigui la correcta."
        translit: ""
        en: "Perhaps the decision is the correct one."
  - id: "s3"
    title: "Malediccions i Ordres Indirectes: Que i Mal llamp"
    body: "S'utilitza la conjunció 'que' seguida de subjuntiu per expressar desitjos adreçats a algú o ordres indirectes. També trobem subjuntiu en determinades malediccions suavitzades tradicionals (com 'mal llamp')."
    examples:
      - target: "Que vagi molt bé l'examen demà!"
        translit: ""
        en: "I hope the exam goes very well tomorrow!"
      - target: "Mal llamp et mati!"
        translit: ""
        en: "Damn you! (Lit. May a bad lightning strike you!)"
