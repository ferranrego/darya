id: c1_14
title: Subordinades de relatiu
subtitle: Antecedent inespecífic
grammarPoint: Subordinades de relatiu amb antecedent inespecífic (alternança indicatiu/subjuntiu)
grammarPointEn: Relative subordinate clauses with non-specific antecedent (indicative/subjunctive alternation)
slides:
  - id: c1_14_s1
    title: Antecedent específic vs inespecífic
    body: Fem servir l'indicatiu quan l'antecedent és conegut o específic, i el subjuntiu quan és desconegut o inespecífic.
    examples:
      - target: Busco la persona que parla català.
        translit: ""
        en: I am looking for the person who speaks Catalan.
        highlight: parla
      - target: Busco una persona que parli català.
        translit: ""
        en: I am looking for a person who speaks Catalan.
        highlight: parli
  - id: c1_14_s2
    title: Oracions negatives i subjuntiu
    body: Quan l'antecedent es nega i, per tant, no existeix, sempre utilitzem el subjuntiu.
    examples:
      - target: No hi ha ningú que ho sàpiga fer millor.
        translit: ""
        en: There is no one who knows how to do it better.
        highlight: sàpiga
      - target: No conec cap metge que visiti a aquesta hora.
        translit: ""
        en: I don't know any doctor who visits at this time.
        highlight: visiti
  - id: c1_14_s3
    title: Pronoms relatius amb subjuntiu
    body: Estructures amb 'qualsevol que', 'qui' o 'on' amb sentit hipotètic requereixen subjuntiu.
    examples:
      - target: Qualsevol que vulgui participar ha d'inscriure's.
        translit: ""
        en: Anyone who wants to participate must register.
        highlight: vulgui
      - target: Anirem on tu prefereixis.
        translit: ""
        en: We will go wherever you prefer.
        highlight: prefereixis
