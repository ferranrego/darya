id: "c1_01"
title: "El passat del subjuntiu"
subtitle: "Pretèrit perfet i plusquamperfet"
grammarPoint: "L'ús del passat en el mode subjuntiu"
grammarPointEn: "Past Subjunctive Uses"
slides:
  - id: "s1"
    title: "Pretèrit Perfet de Subjuntiu"
    body: "Es forma amb el present de subjuntiu del verb 'haver' i el participi del verb principal. Indica una acció passada ja acabada que es vincula al present, o una acció futura que haurà d'estar acabada abans d'un cert moment."
    examples:
      - target: "No crec que en Joan hagi arribat encara."
        translit: ""
        en: "I don't think Joan has arrived yet."
      - target: "Quan hagis acabat els deures, podràs sortir."
        translit: ""
        en: "When you have finished the homework, you can go out."
  - id: "s2"
    title: "Plusquamperfet de Subjuntiu"
    body: "Es forma amb l'imperfet de subjuntiu del verb 'haver' i el participi. Serveix per expressar una acció passada anterior a una altra acció passada, o bé per descriure una hipòtesi irreal en el passat."
    examples:
      - target: "Si m'ho haguessis dit, t'hauria ajudat."
        translit: ""
        en: "If you had told me, I would have helped you."
      - target: "Em va estranyar que no hi haguessin anat."
        translit: ""
        en: "It surprised me that they hadn't gone."
  - id: "s3"
    title: "Diferències d'ús"
    body: "El pretèrit perfet s'usa sovint per accions recents rellevants en el present. El plusquamperfet s'usa per accions més llunyanes o per construir condicions completament irreals situades al passat."
    examples:
      - target: "Espero que tot hagi anat bé avui."
        translit: ""
        en: "I hope everything went well today."
      - target: "Esperava que tot hagués anat bé ahir."
        translit: ""
        en: "I hoped everything had gone well yesterday."
exercises:
