        translit: ""
      - target: "la"
        translit: ""
  - id: c2_02_e5
    type: fillBlank
    target: "Aquest gos no ___ fa cas quan el cridem."
    translit: ""
    en: "This dog doesn't listen to us when we call him."
    answer:
      target: "ens"
      translit: ""
    distractors:
