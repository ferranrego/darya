id: "c2_14"
title: "L'estil indirecte en passat"
subtitle: "Transposició complexa verb/adverbi/pronom"
grammarPoint: "Estil indirecte"
grammarPointEn: "Reported speech in the past"
slides:
  - id: "c2_14_s1"
    title: "Transposició de temps verbals"
    body: "Quan el verb introductori està en passat (p. ex., 'va dir'), els temps verbals del discurs original han de fer un pas enrere en el temps: el present passa a imperfet, el passat i el perfet a plusquamperfet, i el futur a condicional."
    examples:
      - target: "Em va dir que aquell dia no es trobava bé."
        translit: ""
        en: "He told me that he didn't feel well that day."
        highlight: "va dir que... es trobava"
      - target: "Va afirmar que ja ho havien resolt."
        translit: ""
        en: "She stated that they had already resolved it."
        highlight: "havien resolt"
  - id: "c2_14_s2"
    title: "Transposició de l'imperatiu"
    body: "L'imperatiu del discurs directe es transforma en subjuntiu (imperfet de subjuntiu) en l'estil indirecte passat."
    examples:
      - target: "Em va demanar que tanqués la porta."
        translit: ""
        en: "He asked me to close the door."
        highlight: "tanqués"
      - target: "Ens va pregar que no ho diguéssim a ningú."
        translit: ""
        en: "She begged us not to tell anyone."
        highlight: "diguéssim"
  - id: "c2_14_s3"
    title: "Transposició de pronoms i adverbis"
    body: "Els pronoms de primera i segona persona passen a la tercera. Els adverbis de temps i espai també s'allunyen: 'avui' > 'aquell dia', 'ara' > 'aleshores/llavors', 'aquí' > 'allí/allà', 'demà' > 'l'endemà', 'ahir' > 'el dia abans'."
    examples:
      - target: "Va assegurar que l'endemà aniria allà."
        translit: ""
        en: "He assured that he would go there the following day."
        highlight: "l'endemà aniria allà"
      - target: "Van dir que havien arribat el dia abans."
        translit: ""
        en: "They said that they had arrived the day before."
        highlight: "el dia abans"
exercises:
  - id: "c2_14_e1"
    type: "fillBlank"
    target: "Va dir: 'Avui estic cansat.' -> Va dir que ___ dia estava cansat."
    translit: ""
    en: "He said: 'Today I am tired.' -> He said that he was tired that day."
    answer:
      target: "aquell"
      translit: ""
    distractors:
      - target: "aquest"
        translit: ""
      - target: "el"
        translit: ""
  - id: "c2_14_e2"
    type: "fillBlank"
    target: "Va ordenar: 'Surt d'aquí!' -> Va ordenar que ___ d'allà."
    translit: ""
    en: "She ordered: 'Get out of here!' -> She ordered him to get out of there."
    answer:
      target: "sortís"
      translit: ""
    distractors:
      - target: "surt"
        translit: ""
      - target: "sortia"
        translit: ""
  - id: "c2_14_e3"
    type: "fillBlank"
    target: "Va preguntar: 'Ho fareu demà?' -> Va preguntar si ho farien ___."
    translit: ""
    en: "He asked: 'Will you do it tomorrow?' -> He asked if they would do it the following day."
    answer:
      target: "l'endemà"
      translit: ""
    distractors:
      - target: "demà"
        translit: ""
      - target: "ahir"
        translit: ""
  - id: "c2_14_e4"
    type: "fillBlank"
    target: "Ens van explicar que ja hi havien ___."
    translit: ""
    en: "They explained to us that they had already been there."
    answer:
      target: "estat"
      translit: ""
    distractors:
      - target: "estant"
        translit: ""
      - target: "estar"
        translit: ""
  - id: "c2_14_e5"
    type: "fillBlank"
    target: "Va dir: 'No vull anar-hi ara.' -> Va dir que no volia anar-hi ___."
    translit: ""
    en: "He said: 'I don't want to go there now.' -> He said he didn't want to go there then."
    answer:
      target: "llavors"
      translit: ""
    distractors:
      - target: "ara"
        translit: ""
      - target: "després"
        translit: ""
