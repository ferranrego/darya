id: "c1_02"
title: "Condicionals impossibles"
subtitle: "Situacions hipotètiques en el passat"
grammarPoint: "Plusquamperfet subjuntiu + condicional compost"
grammarPointEn: "Impossible Conditionals"
slides:
  - id: "s1"
    title: "Estructura de la Condicional Impossible"
    body: "Expressa una condició irreal en el passat i el seu resultat també en el passat (ja impossible d'acomplir). La condició utilitza el plusquamperfet de subjuntiu, i la conseqüència utilitza el condicional compost."
    examples:
      - target: "Si hagués estudiat més, hauria aprovat l'examen."
        translit: ""
        en: "If I had studied more, I would have passed the exam."
      - target: "Si no hagués plogut, hauríem anat a la platja."
        translit: ""
        en: "If it hadn't rained, we would have gone to the beach."
  - id: "s2"
    title: "El Condicional Compost"
    body: "Es forma amb el condicional simple del verb 'haver' (hauria, hauries, hauria, hauríem, hauríeu, haurien) més el participi del verb principal. Expressa una acció que podria haver passat, amb freqüència vinculada a una condició, però que no va tenir lloc."
    examples:
      - target: "Sense la teva ajuda, no ho hauria aconseguit."
        translit: ""
        en: "Without your help, I wouldn't have achieved it."
      - target: "Jo hauria preferit quedar-me a casa tranquil·lament."
        translit: ""
        en: "I would have preferred to stay home quietly."
  - id: "s3"
    title: "L'ordre de les oracions"
    body: "L'ordre de l'oració principal i la subordinada es pot invertir lliurement sense que canviï el significat global de la frase. Si comencem per la condició 'Si...', la separem amb una coma."
    examples:
      - target: "Haurien arribat a temps si no s'haguessin perdut."
        translit: ""
        en: "They would have arrived on time if they hadn't gotten lost."
      - target: "Si no s'haguessin perdut, haurien arribat a temps."
        translit: ""
        en: "If they hadn't gotten lost, they would have arrived on time."
exercises:
  - id: "e1"
    type: "fillBlank"
    target: "Si m'ho haguessis demanat, jo t'___ ajudat de seguida."
    translit: ""
    en: "If you had asked me, I would have helped you right away."
    answer:
      target: "hauria"
      translit: ""
    distractors:
      - target: "hagués"
        translit: ""
      - target: "hauré"
        translit: ""
  - id: "e2"
    type: "fillBlank"
    target: "Si nosaltres ___ d'hora ahir, no hauríem perdut el tren."
    translit: ""
    en: "If we had left early yesterday, we wouldn't have missed the train."
    answer:
      target: "haguéssim sortit"
      translit: ""
    distractors:
      - target: "hauríem sortit"
        translit: ""
      - target: "sortíem"
        translit: ""
  - id: "e3"
    type: "fillBlank"
    target: "Ells ___ estat molt més feliços si haguessin viscut al camp."
    translit: ""
    en: "They would have been much happier if they had lived in the countryside."
    answer:
      target: "haurien"
      translit: ""
    distractors:
      - target: "haguessin"
        translit: ""
      - target: "hauran"
        translit: ""
  - id: "e4"
    type: "fillBlank"
    target: "Si jo ___ més diners en aquell moment, m'hauria comprat el cotxe."
    translit: ""
    en: "If I had had more money at that time, I would have bought the car."
    answer:
      target: "hagués tingut"
      translit: ""
    distractors:
      - target: "tindria"
        translit: ""
      - target: "hauria tingut"
        translit: ""
  - id: "e5"
    type: "fillBlank"
    target: "No hauries tingut aquest problema si ___ els consells del metge."
    translit: ""
    en: "You wouldn't have had this problem if you had followed the doctor's advice."
    answer:
      target: "haguessis seguit"
      translit: ""
    distractors:
      - target: "hauries seguit"
        translit: ""
      - target: "hagis seguit"
        translit: ""
