id: b2_11
title: Verbs pronominals
subtitle: adonar-se, queixar-se, penedir-se
grammarPoint: "Verbs que exigeixen o admeten l'ús de pronoms febles."
grammarPointEn: "Pronominal verbs."
slides:
  - id: b2_11_s1
    title: Què són els verbs pronominals?
    body: "Alguns verbs s'han de conjugar necessàriament amb un pronom feble que concorda amb el subjecte (em, et, es, ens, us, es). Exemples típics: *queixar-se, penedir-se, adonar-se, atrevir-se*."
    examples:
      - target: "Ell sempre es queixa del fred."
        translit: ""
        en: "He always complains about the cold."
        highlight: "es queixa"
      - target: "Ens penedim d'haver arribat tard."
        translit: ""
        en: "We regret having arrived late."
        highlight: "Ens penedim"
  - id: b2_11_s2
    title: Adonar-se
    body: "El verb *adonar-se* (notar, percebre alguna cosa) sempre va acompanyat d'un pronom, i porta la preposició *de* davant del seu complement."
    examples:
      - target: "M'he adonat de la meva errada."
        translit: ""
        en: "I have realized my mistake."
        highlight: "M'he adonat de"
      - target: "No s'adonen del perill."
        translit: ""
        en: "They don't realize the danger."
        highlight: "s'adonen de"
  - id: b2_11_s3
    title: Queixar-se i penedir-se
    body: "Aquests verbs també demanen la preposició *de* pel seu complement de règim."
    examples:
      - target: "T'has queixat del soroll?"
        translit: ""
        en: "Did you complain about the noise?"
        highlight: "T'has queixat de"
      - target: "Em penedeixo d'haver dit això."
        translit: ""
        en: "I regret having said that."
        highlight: "Em penedeixo de"
