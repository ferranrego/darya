id: "c2_11"
title: "Locucions adverbials genuïnes"
subtitle: "Genuine adverbial phrases"
grammarPoint: "Coneixement i ús de locucions adverbials pròpies del català per enriquir l'expressió."
grammarPointEn: "Knowledge and use of native Catalan adverbial phrases to enrich expression."
slides:
  - id: "c2_11_slide1"
    title: "De bell antuvi / A la bestreta"
    body: "'De bell antuvi' significa des del primer moment, per endavant. 'A la bestreta' vol dir anticipadament, per endavant."
    examples:
      - target: "Us ho adverteixo de bell antuvi perquè no hi hagi sorpreses."
        translit: ""
        en: "I'm warning you right from the start so there are no surprises."
        highlight: "de bell antuvi"
      - target: "No jutgis a la bestreta sense conèixer els fets."
        translit: ""
        en: "Don't judge in advance without knowing the facts."
        highlight: "a la bestreta"
  - id: "c2_11_slide2"
    title: "De retruc"
    body: "Significa de rebot, com a conseqüència indirecta d'una altra cosa."
    examples:
      - target: "La crisi al sector automobilístic ha afectat, de retruc, moltes altres empreses."
        translit: ""
        en: "The crisis in the automotive sector has affected, as a knock-on effect, many other companies."
        highlight: "de retruc"
      - target: "Ho vaig descobrir de retruc, mentre buscava una altra informació."
        translit: ""
        en: "I discovered it indirectly, while looking for other information."
        highlight: "de retruc"
  - id: "c2_11_slide3"
    title: "Ras i curt"
    body: "Significa de manera clara, concisa i sense embuts."
    examples:
      - target: "Li ho va dir ras i curt: no volia continuar treballant allà."
        translit: ""
        en: "She told him plain and simple: she didn't want to keep working there."
        highlight: "ras i curt"
      - target: "Ras i curt, el projecte ha estat un fracàs absolut."
        translit: ""
        en: "Short and sweet, the project has been an absolute failure."
        highlight: "Ras i curt"
exercises:
  - id: "c2_11_ex1"
    type: "fillBlank"
    target: "Sabia ___ que aquella idea no funcionaria."
    translit: ""
    en: "He knew right from the start that the idea wouldn't work."
    answer:
      target: "de bell antuvi"
      translit: ""
    distractors:
      - target: "de retruc"
        translit: ""
      - target: "ras i curt"
        translit: ""
  - id: "c2_11_ex2"
    type: "fillBlank"
    target: "M'han cobrat les despeses ___."
    translit: ""
    en: "They charged me the expenses in advance."
    answer:
      target: "a la bestreta"
      translit: ""
    distractors:
      - target: "ras i curt"
        translit: ""
      - target: "de retruc"
        translit: ""
  - id: "c2_11_ex3"
    type: "fillBlank"
    target: "La pujada del petroli encarirà, ___, el preu dels bitllets d'avió."
    translit: ""
    en: "The rise in oil will make, as a knock-on effect, plane tickets more expensive."
    answer:
      target: "de retruc"
      translit: ""
    distractors:
      - target: "de bell antuvi"
        translit: ""
      - target: "a la bestreta"
        translit: ""
  - id: "c2_11_ex4"
    type: "fillBlank"
    target: "Vull que m'expliquis la veritat, ___ i sense amagar res."
    translit: ""
    en: "I want you to tell me the truth, plain and simple and without hiding anything."
    answer:
      target: "ras i curt"
      translit: ""
    distractors:
      - target: "de retruc"
        translit: ""
      - target: "de bell antuvi"
        translit: ""
  - id: "c2_11_ex5"
    type: "fillBlank"
    target: "Ja els ho vaig dir ___: les normes són aquestes per a tothom."
    translit: ""
    en: "I already told them right from the start: these are the rules for everyone."
    answer:
      target: "de bell antuvi"
      translit: ""
    distractors:
      - target: "de retruc"
        translit: ""
      - target: "a la bestreta"
        translit: ""
