id: b2_09
title: Pronoms relatius simples i compostos
subtitle: que, què, qui vs el qual
grammarPoint: "Ús dels pronoms relatius simples i compostos."
grammarPointEn: "Use of simple and compound relative pronouns."
slides:
  - id: b2_09_s1
    title: Pronoms relatius simples (que, qui)
    body: "El pronom relatiu *que* és invariable i s'usa per referir-se a persones o coses. *Qui* s'usa només per a persones, sovint després de preposició."
    examples:
      - target: "El llibre que llegeixo és interessant."
        translit: ""
        en: "The book that I am reading is interesting."
        highlight: "que"
      - target: "La dona a qui vaig donar el paquet és la meva tia."
        translit: ""
        en: "The woman to whom I gave the package is my aunt."
        highlight: "a qui"
  - id: b2_09_s2
    title: El relatiu "què"
    body: "S'usa *què* per referir-se a coses quan va precedit d'una preposició (a, de, en, amb, per, etc.)."
    examples:
      - target: "El problema de què parles és greu."
        translit: ""
        en: "The problem about which you speak is serious."
        highlight: "de què"
      - target: "L'eina amb què treballo és nova."
        translit: ""
        en: "The tool with which I work is new."
        highlight: "amb què"
  - id: b2_09_s3
    title: Pronoms relatius compostos (el qual, la qual...)
    body: "Els relatius compostos (*el qual*, *la qual*, *els quals*, *les quals*) es poden fer servir en lloc de preposició + *què/qui*, sentant més formals, o bé en oracions explicatives."
    examples:
      - target: "La casa en la qual visc té molts anys."
        translit: ""
        en: "The house in which I live is many years old."
        highlight: "en la qual"
      - target: "El meu germà, el qual viu a Londres, vindrà demà."
        translit: ""
        en: "My brother, who lives in London, will come tomorrow."
        highlight: "el qual"
