id: b2_10
title: Relatius amb preposició
subtitle: la casa en què / en la qual visc
grammarPoint: "Ús de pronoms relatius darrere d'una preposició."
grammarPointEn: "Use of relative pronouns following a preposition."
slides:
  - id: b2_10_s1
    title: Relatius per a coses amb preposició (què)
    body: "Quan l'antecedent és una cosa i el pronom relatiu va introduït per una preposició (a, en, de, amb, per...), s'utilitza principalment *què*."
    examples:
      - target: "El projecte en què treballo és molt llarg."
        translit: ""
        en: "The project in which I work is very long."
        highlight: "en què"
      - target: "El cotxe amb què viatgem és híbrid."
        translit: ""
        en: "The car with which we travel is hybrid."
        highlight: "amb què"
  - id: b2_10_s2
    title: Relatius per a persones amb preposició (qui)
    body: "Si l'antecedent és una persona, darrere de preposició s'utilitza *qui* (i no *què* ni pas *que*)."
    examples:
      - target: "L'amic en qui més confio viu fora."
        translit: ""
        en: "The friend in whom I trust the most lives abroad."
        highlight: "en qui"
      - target: "La gent per a qui treballem és exigent."
        translit: ""
        en: "The people for whom we work are demanding."
        highlight: "per a qui"
  - id: b2_10_s3
    title: Alternativa amb els relatius compostos
    body: "Tant *què* com *qui* poden ser substituïts pel relatiu compost corresponent (*el qual, la qual, els quals, les quals*) precedit per la preposició. Això aporta un to més culte o formal."
    examples:
      - target: "La ciutat en la qual visc té molts parcs."
        translit: ""
        en: "The city in which I live has many parks."
        highlight: "en la qual"
      - target: "Els professors amb els quals vam parlar eren molt amables."
        translit: ""
        en: "The teachers with whom we spoke were very kind."
        highlight: "amb els quals"
