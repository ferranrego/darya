id: c2_07
title: "Correcció del gerundi: posterioritat i copulatiu"
subtitle: "Evitant calcs del castellà en l'ús del gerundi"
grammarPoint: "El gerundi de posterioritat i copulatiu"
grammarPointEn: "The gerund of posteriority and copulative gerund"
slides:
  - id: c2_07_slide_1
    title: "Què és el gerundi de posterioritat?"
    body: "En català, el gerundi sempre ha d'expressar una acció simultània o anterior a la del verb principal. No s'ha d'usar per expressar una acció posterior o una conseqüència (un ús freqüent en castellà, l'anomenat 'gerundi de posterioritat'). En lloc d'això, s'usen conjuncions com 'i' o estructures de relatiu."
    examples:
      - target: "El lladre va fugir, i va ser detingut hores més tard."
        translit: "El lladre va fugir, i va ser detingut hores més tard."
        en: "The thief fled and was arrested hours later."
        highlight: "i va ser detingut"
      - target: "La llei es va aprovar el 2010 i va entrar en vigor l'any següent."
        translit: "La llei es va aprovar el 2010 i va entrar en vigor l'any següent."
        en: "The law was passed in 2010 and came into effect the following year."
        highlight: "i va entrar"
  - id: c2_07_slide_2
    title: "El gerundi copulatiu (o d'addició)"
    body: "Tampoc és correcte usar el gerundi com a equivalent de la conjunció copulativa 'i' per afegir informació que no és simultània. Sovint ho corregim amb oracions de relatiu ('que') o simplement canviant el gerundi per un verb conjugat unit per 'i'."
    examples:
      - target: "S'ha publicat un decret que regula aquestes activitats."
        translit: "S'ha publicat un decret que regula aquestes activitats."
        en: "A decree has been published that regulates these activities."
        highlight: "que regula"
      - target: "He rebut una capsa que conté llibres."
        translit: "He rebut una capsa que conté llibres."
        en: "I have received a box containing books."
        highlight: "que conté"
  - id: c2_07_slide_3
    title: "Més alternatives al gerundi incorrecte"
    body: "A part de la coordinació ('i') o la subordinació ('que'), podem recórrer a d'altres connectors temporals i causals per evitar el calc de gerundis espuris."
    examples:
      - target: "Va caure per les escales, de manera que es va trencar la cama."
        translit: "Va caure per les escales, de manera que es va trencar la cama."
        en: "He fell down the stairs, breaking his leg (so he broke his leg)."
        highlight: "de manera que es va trencar"
