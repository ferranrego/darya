id: "c2_13"
title: "Coordinacions complexes i paral·lelismes"
subtitle: "tant... com, no solament... sinó també"
grammarPoint: "Correlacions estructurals"
grammarPointEn: "Complex coordinations and parallelisms"
slides:
  - id: "c2_13_s1"
    title: "Estructures paral·leles amb 'tant... com'"
    body: "La construcció 'tant... com' s'utilitza per coordinar elements equivalents, donant a entendre que ambdós són certs i reben la mateixa importància."
    examples:
      - target: "Hi van assistir tant els professors com els alumnes."
        translit: ""
        en: "Both the teachers and the students attended."
        highlight: "tant els professors com els alumnes"
      - target: "Ho haurem de fer tant si vols com si no."
        translit: ""
        en: "We will have to do it whether you want to or not."
        highlight: "tant si vols com si no"
  - id: "c2_13_s2"
    title: "La coordinació 'no solament... sinó (que) també'"
    body: "S'utilitza per emfatitzar que no només es dona una circumstància, sinó que se n'hi afegeix una altra, sovint més rellevant. Cal usar 'que' davant d'un verb conjugat."
    examples:
      - target: "No solament és intel·ligent, sinó també molt treballador."
        translit: ""
        en: "Not only is he intelligent, but also very hardworking."
        highlight: "No solament és intel·ligent, sinó també"
      - target: "No solament no va venir, sinó que també va apagar el telèfon."
        translit: ""
        en: "Not only did he not come, but he also turned off his phone."
        highlight: "sinó que també"
  - id: "c2_13_s3"
    title: "Altres correlacions: 'ni... ni', 'o bé... o bé'"
    body: "Altres estructures de coordinació complexa serveixen per excloure o donar alternatives equivalents. S'han de mantenir paral·leles quant a la categoria gramatical."
    examples:
      - target: "No ha dit ni que sí ni que no."
        translit: ""
        en: "He hasn't said either yes or no."
        highlight: "ni que sí ni que no"
      - target: "O bé ho fas ara, o bé ho deixes per a demà."
        translit: ""
        en: "Either you do it now, or you leave it for tomorrow."
        highlight: "O bé ho fas ara, o bé ho deixes"
exercises:
