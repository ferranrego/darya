id: "c2_10"
title: "Locucions prepositives formals"
subtitle: "Formal prepositional phrases"
grammarPoint: "L'ús de locucions prepositives de registre culte i formal en català."
grammarPointEn: "The use of formal prepositional phrases in Catalan."
slides:
  - id: "c2_10_slide1"
    title: "A despit de"
    body: "La locució 'a despit de' s'utilitza per indicar una oposició, equivalent a 'malgrat' o 'tot i'. És pròpia de registres formals."
    examples:
      - target: "A despit de les dificultats, van aconseguir acabar el projecte."
        translit: ""
        en: "Despite the difficulties, they managed to finish the project."
        highlight: "A despit de"
      - target: "Va continuar endavant a despit de les crítiques."
        translit: ""
        en: "She kept going in spite of the criticism."
        highlight: "a despit de"
  - id: "c2_10_slide2"
    title: "En detriment de"
    body: "S'usa per expressar que una acció causa un dany, perjudici o desavantatge a alguna cosa o algú."
    examples:
      - target: "Han afavorit l'economia en detriment del medi ambient."
        translit: ""
        en: "They have favored the economy to the detriment of the environment."
        highlight: "en detriment de"
      - target: "El canvi es va fer en detriment dels seus drets."
        translit: ""
        en: "The change was made to the detriment of their rights."
        highlight: "en detriment de"
  - id: "c2_10_slide3"
    title: "A recer de"
    body: "Aquesta locució significa estar protegit o arrecerat d'algun perill, o bé emparat per algú o alguna cosa."
    examples:
      - target: "Es van posar a recer de la tempesta."
        translit: ""
        en: "They took shelter from the storm."
        highlight: "a recer de"
      - target: "A recer d'aquella llei, van poder actuar amb impunitat."
        translit: ""
        en: "Under the protection of that law, they were able to act with impunity."
        highlight: "A recer d'"
exercises:
  - id: "c2_10_ex1"
    type: "fillBlank"
    target: "___ de les recomanacions mèdiques, va continuar viatjant."
    translit: ""
    en: "Despite the medical recommendations, he continued traveling."
    answer:
      target: "A despit"
      translit: ""
    distractors:
      - target: "A recer"
        translit: ""
      - target: "En detriment"
        translit: ""
  - id: "c2_10_ex2"
    type: "fillBlank"
    target: "El nou pla urbanístic s'ha aprovat ___ de les zones verdes."
    translit: ""
    en: "The new urban plan has been approved to the detriment of green areas."
    answer:
      target: "en detriment"
      translit: ""
    distractors:
      - target: "a despit"
        translit: ""
      - target: "a recer"
        translit: ""
  - id: "c2_10_ex3"
    type: "fillBlank"
    target: "Van construir el refugi ___ dels vents forts del nord."
    translit: ""
    en: "They built the shelter protected from the strong north winds."
    answer:
      target: "a recer"
      translit: ""
    distractors:
      - target: "a despit"
        translit: ""
      - target: "en detriment"
        translit: ""
  - id: "c2_10_ex4"
    type: "fillBlank"
    target: "Han reduït la inversió pública ___ dels serveis socials bàsics."
    translit: ""
    en: "They have reduced public investment to the detriment of basic social services."
    answer:
      target: "en detriment"
      translit: ""
    distractors:
      - target: "a recer"
        translit: ""
      - target: "a despit"
        translit: ""
  - id: "c2_10_ex5"
    type: "fillBlank"
    target: "___ de la pluja, el concert no es va suspendre."
    translit: ""
    en: "Despite the rain, the concert was not canceled."
    answer:
      target: "A despit"
      translit: ""
    distractors:
      - target: "A recer"
        translit: ""
      - target: "En detriment"
        translit: ""
