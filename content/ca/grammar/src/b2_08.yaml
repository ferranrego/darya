id: b2_08
title: "Els pronoms en posició enclítica"
subtitle: "Donar-li-ho, donant-l'hi"
grammarPoint: "Els pronoms en posició enclítica (darrere del verb)"
grammarPointEn: "Pronouns in enclitic position (after the verb)"
slides:
  - id: b2_08_1
    title: "Posició dels pronoms"
    body: "Els pronoms febles es posen obligatòriament darrere del verb (enclítics) quan el verb està en infinitiu, gerundi o imperatiu positiu. Si n'hi ha més d'un, també s'uneixen entre si al darrere del verb."
    examples:
      - target: "Vull explicar-li la veritat. -> Vull explicar-li-la."
        translit: ""
        en: "I want to explain the truth to him. -> I want to explain it to him."
        highlight: "explicar-li-la"
      - target: "Està explicant el problema al cap. -> Està explicant-l'hi."
        translit: ""
        en: "He is explaining the problem to the boss. -> He is explaining it to him."
        highlight: "explicant-l'hi"
  - id: b2_08_2
    title: "Ús del guionet o apòstrof"
    body: "S'utilitza l'apòstrof si és possible segons les regles generals d'apostrofació dels pronoms, i si no s'utilitza un guionet. Es llegeix de forma consecutiva d'esquerra a dreta per saber on col·locar el guionet o apòstrof."
    examples:
      - target: "Porta el llibre aquí. -> Porta'l aquí."
        translit: ""
        en: "Bring the book here. -> Bring it here."
        highlight: "Porta'l"
      - target: "Dona el regal al noi. -> Dona-l'hi."
        translit: ""
        en: "Give the gift to the boy. -> Give it to him."
        highlight: "Dona-l'hi"
      - target: "Digueu això a la mare. -> Digueu-li-ho."
        translit: ""
        en: "Say this to mother. -> Say it to her."
        highlight: "Digueu-li-ho"
  - id: b2_08_3
    title: "Ordre dels pronoms enclítics"
    body: "L'ordre és: Pronom reflexiu/impersonal (es) + Pronom de CI (em, et, li, ens, us, els) + Pronom de CD (el, la, els, les, ho) + Pronom 'en' + Pronom 'hi'. Els elements s'uneixen combinant el guionet i apòstrof on sigui normativament aplicable."
    examples:
      - target: "No te n'oblidis de portar-se'n el llibre (emportar-se el llibre)."
        translit: ""
        en: "Don't forget to take the book away."
        highlight: "portar-se'n"
      - target: "És difícil al principi, però és qüestió d'acostumar-s'hi."
        translit: ""
        en: "It is difficult at first, but it's a matter of getting used to it."
        highlight: "acostumar-s'hi"
