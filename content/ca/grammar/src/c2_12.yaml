id: "c2_12"
title: "Precisió lèxica (Els verbs baül)"
subtitle: "Lexical precision (Overused verbs)"
grammarPoint: "Substitució de verbs massa generals (fer, tenir, dir, posar) per verbs més precisos en registres formals."
grammarPointEn: "Replacing overly general verbs (fer, tenir, dir, posar) with more precise ones in formal registers."
slides:
  - id: "c2_12_slide1"
    title: "El verb 'fer'"
    body: "En registre formal, cal evitar l'abús de 'fer'. Segons el context, podem utilitzar verbs com elaborar, construir, formular, cometre, etc."
    examples:
      - target: "Han formulat una pregunta molt interessant al conferenciant."
        translit: ""
        en: "They have asked a very interesting question to the speaker."
        highlight: "formulat"
      - target: "Van cometre una errada greu en la redacció del contracte."
        translit: ""
        en: "They made a serious mistake in drafting the contract."
        highlight: "cometre"
  - id: "c2_12_slide2"
    title: "El verb 'tenir'"
    body: "Es pot substituir per verbs com experimentar, patir, gaudir, aconseguir o exercir, segons allò que s'expressa."
    examples:
      - target: "Aquesta associació exerceix molta influència en la política local."
        translit: ""
        en: "This association has a lot of influence on local politics."
        highlight: "exerceix"
      - target: "El pacient va experimentar una millora notable l'endemà."
        translit: ""
        en: "The patient experienced a notable improvement the next day."
        highlight: "experimentar"
  - id: "c2_12_slide3"
    title: "Els verbs 'dir' i 'posar'"
    body: "'Dir' es pot canviar per afirmar, declarar, expressar o esmentar. 'Posar' es pot substituir per col·locar, instal·lar, establir o situar."
    examples:
      - target: "El president va declarar que no apujarien els impostos."
        translit: ""
        en: "The president stated that they would not raise taxes."
        highlight: "declarar"
      - target: "Han establert noves condicions per accedir a la beca."
        translit: ""
        en: "They have set new conditions to access the scholarship."
        highlight: "establert"
