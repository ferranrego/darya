id: c2_09
title: "Verbs de règim fix i pronominalització"
subtitle: "Canvis de règim i selecció de pronoms"
grammarPoint: "Verbs de règim fix i canvis de pronominalització"
grammarPointEn: "Fixed-regimen verbs and pronominalization changes"
slides:
  - id: c2_09_slide_1
    title: "Verbs amb canvi de règim respecte al castellà"
    body: "Hi ha verbs que en català tenen un règim de complement diferent. Un dels casos més clars és 'trucar'. En català estàndard, 'trucar' es pot utilitzar com a transitiu (trucar algú) i també com a intransitiu (trucar a algú), però cal parar atenció en la pronominalització: 'la truco' (CD) o 'li truco' (CI)."
    examples:
      - target: "He de trucar la Maria i explicar-li-ho."
        translit: "He de trucar la Maria i explicar-li-ho."
        en: "I have to call Maria and explain it to her."
        highlight: "trucar la Maria"
      - target: "Ja la trucaré demà."
        translit: "Ja la trucaré demà."
        en: "I'll call her tomorrow."
        highlight: "la trucaré"
  - id: c2_09_slide_2
    title: "Altres verbs de règim divergent"
    body: "Molts verbs regeixen preposicions específiques (en, a, de, amb). Per exemple: 'pensar en', 'adonar-se de', 'acostumar-se a', 'interessar-se per', 'rient de'."
    examples:
      - target: "No m'havia adonat d'aquest detall."
        translit: "No m'havia adonat d'aquest detall."
        en: "I hadn't noticed this detail."
        highlight: "adonat d'"
      - target: "Pensa en mi quan siguis lluny."
        translit: "Pensa en mi quan siguis lluny."
        en: "Think of me when you are far away."
        highlight: "en mi"
  - id: c2_09_slide_3
    title: "Pronominalització de complements de règim verbal"
    body: "El complement de règim introduït per 'de' se substitueix pel pronom feble 'en'. El complement introduït per 'a', 'en', 'amb' o 'per' generalment se substitueix pel pronom 'hi'."
    examples:
      - target: "T'has adonat de l'error? Sí, que me n'he adonat."
        translit: "T'has adonat de l'error? Sí, que me n'he adonat."
        en: "Did you notice the error? Yes, I noticed it."
        highlight: "me n'"
      - target: "T'has acostumat a l'horari? Sí, ja m'hi he acostumat."
        translit: "T'has acostumat a l'horari? Sí, ja m'hi he acostumat."
        en: "Have you gotten used to the schedule? Yes, I have already gotten used to it."
        highlight: "m'hi"
exercises:
  - id: c2_09_ex_1
    type: fillBlank
    target: "Aquest matí he vist la meva tieta i ___ he trucat a la tarda."
    translit: "Aquest matí he vist la meva tieta i ___ he trucat a la tarda."
    en: "This morning I saw my aunt and I called her in the afternoon."
    answer:
      target: "l'"
      translit: "l'"
    distractors:
      - target: "hi"
        translit: "hi"
      - target: "en"
        translit: "en"
