        translit: "al"
  - id: c2_09_ex_4
    type: fillBlank
    target: "¿T'has recordat de comprar el pa? Sí, ja me ___ he recordat."
    translit: "¿T'has recordat de comprar el pa? Sí, ja me ___ he recordat."
    en: "Did you remember to buy the bread? Yes, I remembered it."
    answer:
      target: "n'"
      translit: "n'"
    distractors:
