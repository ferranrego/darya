        translit: "l'"
      - target: "ho"
        translit: "ho"
  - id: c2_09_ex_5
    type: fillBlank
    target: "Estic acostumat a treballar de nit. Sí, jo també m'___ estic acostumat."
    translit: "Estic acostumat a treballar de nit. Sí, jo també m'___ estic acostumat."
    en: "I'm used to working at night. Yes, I'm used to it too."
    answer:
