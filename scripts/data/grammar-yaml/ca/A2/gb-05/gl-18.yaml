id: gl-18
title: m'agrada
subtitle: The verb that turns the sentence around.
grammarPoint: agradar-construction
grammarPointEn: "agradar and verbs like it: the thing liked is the grammatical
  subject, so the verb agrees with it and the person takes a weak pronoun"
slides:
  - id: gs-18-1
    title: The thing you like is the subject
    body: Catalan says something closer to "coffee pleases me". So the verb agrees
      with the thing, not with you.
    examples:
      - target: M'agrada el cafè.
        en: I like coffee.
      - target: M'agraden els llibres.
        en: I like books.
        highlight: agraden
      - target: T'agrada la música?
        en: Do you like music?
  - id: gs-18-2
    title: Only the pronoun changes for the person
    body: em, et, li, ens, us, els - the same weak pronouns, with the vowel forms m'
      and t' before agrada.
    examples:
      - target: Li agrada llegir.
        en: She likes reading.
      - target: Ens agrada aquesta casa.
        en: We like this house.
    table:
      - - jo
        - m'agrada
      - - tu
        - t'agrada
      - - ell, ella
        - li agrada
      - - nosaltres
        - ens agrada
      - - vosaltres
        - us agrada
      - - ells, elles
        - els agrada
  - id: gs-18-3
    title: A few more verbs work the same way
    body: Once you have agradar, these come free.
    examples:
      - target: M'encanta la platja.
        en: I love the beach.
      - target: Em fa mal el cap.
        en: My head hurts.
    table:
      - - agradar
        - to like
      - - encantar
        - to love
      - - interessar
        - to interest
      - - fer mal
        - to hurt
      - - faltar
        - to be missing
exercises:
  - id: ge-18-1
    type: fillBlank
    target: ___ agrada el cafè.
    en: I like coffee.
    answer:
      target: M'
    distractors:
      - target: Em
      - target: Jo
      - target: Me
  - id: ge-18-2
    type: fillBlank
    target: M'___ els llibres.
    en: I like books.
    answer:
      target: agraden
    distractors:
      - target: agrada
      - target: agradar
      - target: agradava
  - id: ge-18-3
    type: fillBlank
    target: A la Marta ___ agrada llegir.
    en: Marta likes reading.
    answer:
      target: li
    distractors:
      - target: el
      - target: la
      - target: es
  - id: ge-18-4
    type: fillBlank
    target: ___ agrada aquesta casa.
    en: We like this house.
    answer:
      target: Ens
    distractors:
      - target: Em
      - target: Us
      - target: Els
  - id: ge-18-5
    type: fillBlank
    target: Em fa ___ el cap.
    en: My head hurts.
    answer:
      target: mal
    distractors:
      - target: dolor
      - target: malalt
      - target: mala
  - id: ge-18-6
    type: spotError
    target: M'agrada els llibres.
    en: I like books.
    errorWord:
      target: M'agrada
    correction:
      target: M'agraden
    hint: The verb agrees with the books.
    correctedTarget: M'agraden els llibres.
  - id: ge-18-7
    type: buildSentence
    en: I like this house a lot.
    words:
      - target: M'
      - target: agrada
      - target: molt
      - target: aquesta
      - target: casa
    extraWords:
      - target: agraden
      - target: jo
  - id: ge-18-8
    type: chooseTranslation
    direction: toEn
    target: T'agraden les pel·lícules?
    en: Do you like films?
    distractorsEn:
      - Do you like the film?
      - Did you like the films?
      - Do the films please you today?
    distractorsTarget: []
