id: gl-42
title: L'Impersonal 'Es' i la Passiva Reflexa
subtitle: Domini dels Pronoms Febles
grammarPoint: Ús de 'es' impersonal i la passiva reflexa
grammarPointEn: Using impersonal 'es' and reflexive passive
slides:
  - title: Passiva reflexa
    content: "S'utilitza 'es' més el verb en 3a persona per indicar que una acció es
      fa sobre un subjecte pacient (que concorda amb el verb). Exemple: Es ven
      un pis / Es venen pisos."
    id: gs-42-1
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    examples:
      - target: Exemple
        en: Example
  - title: L'impersonal 'es'
    content: "S'utilitza 'es' més el verb en 3a persona del singular per indicar una
      acció sense un subjecte específic. Exemple: Es diu que plourà."
    id: gs-42-2
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    examples:
      - target: Exemple
        en: Example
