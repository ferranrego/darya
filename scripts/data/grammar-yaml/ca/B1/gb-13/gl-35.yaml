id: gl-35
title: "Pronoms relatius: on i el qual"
subtitle: "Relative pronouns: on, el qual, la qual..."
grammarPoint: Ús d'on i el qual
grammarPointEn: Usage of on and el qual
slides:
  - slideId: gl-35-s1
    title: El pronom relatiu 'on'
    content: >-
      S'utilitza per indicar lloc (equivaleix a 'en el qual', 'a la qual',
      etc.). Pot anar acompanyat de preposicions com *a*, *cap a*, *de*, *des
      de*, *per*.


      Exemples:

      - El poble **on** vaig néixer és petit.

      - La ciutat **d'on** vinc és molt bonica.
    id: gs-35-1
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    examples:
      - target: Exemple
        en: Example
  - slideId: gl-35-s2
    title: Els pronoms 'el qual', 'la qual', 'els quals', 'les quals'
    content: >-
      Generalment s'utilitzen darrere de preposició forta (damunt, sota, contra,
      durant...) o preposicions compostes. També s'usen per evitar ambigüitats
      en oracions explicatives.


      Exemples:

      - L'edifici davant **del qual** ens vam trobar.

      - La raó per **la qual** no vinc és que estic malalt.
    id: gs-35-2
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    examples:
      - target: Exemple
        en: Example
exercises:
  - id: ge-35-1
    type: fillBlank
    target: Aquesta és la casa ___ vaig viure d'infant.
    en: This is the house where I lived as a child.
