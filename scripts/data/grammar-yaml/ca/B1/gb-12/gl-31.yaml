    distractors:
      - target: obria
      - target: obriré
  - id: ge-31-2
    type: fillBlank
    target: A mi m'___ (agradar) viure a prop del mar.
    en: I would like to live near the sea.
    answer:
      target: agradaria
    distractors:
      - target: agrada
      - target: agradarà
  - id: ge-31-3
    type: fillBlank
    target: Nosaltres ___ (poder) ajudar-vos amb el trasllat demà.
