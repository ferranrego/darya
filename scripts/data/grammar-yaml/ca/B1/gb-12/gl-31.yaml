id: gl-31
title: El Condicional
subtitle: Formació i irregulars
grammarPoint: El condicional simple s'utilitza per expressar desitjos,
  probabilitats, consells o accions que depenen d'una condició. Es forma afegint
  les terminacions -ia, -ies, -ia, -íem, -íeu, -ien a l'infinitiu del verb. Els
  verbs que són irregulars en el futur (com fer, poder) comparteixen la mateixa
  arrel irregular en el condicional.
grammarPointEn: The simple conditional is used to express wishes, probabilities,
  advice, or actions that depend on a condition. It is formed by adding the
  endings -ia, -ies, -ia, -íem, -íeu, -ien to the infinitive of the verb. Verbs
  that are irregular in the future (like fer, poder) share the same irregular
  stem in the conditional.
slides:
  - slideId: gl-31-s-1
    content: |
      **El Condicional Simple: Formació Regular**
      Per als verbs regulars, afegim les terminacions a l'infinitiu:
      - **Jo:** -ia (cantaria, perdria, dormiria)
      - **Tu:** -ies (cantaries, perdries, dormiries)
      - **Ell/Ella:** -ia (cantaria, perdria, dormiria)
      - **Nosaltres:** -íem (cantaríem, perdríem, dormiríem)
      - **Vosaltres:** -íeu (cantaríeu, perdríeu, dormiríeu)
      - **Ells/Elles:** -ien (cantarien, perdrien, dormirien)
    contentEn: For regular verbs, we add the endings to the infinitive.
    id: gs-31-1
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    title: Concept 1
    examples:
      - target: Exemple
        en: Example
  - slideId: gl-31-s-2
    content: |
      **Verbs Irregulars al Condicional**
      Comparteixen l'arrel irregular del futur. Només canvien les terminacions:
      - **Anar:** aniria, aniries...
      - **Fer:** faria, faries...
      - **Haver:** hauria, hauries...
      - **Poder:** podria, podries...
      - **Saber:** sabria, sabries...
      - **Tenir:** tindria, tindries...
      - **Venir:** vindria, vindries...
      - **Voler:** voldria, voldries...
    contentEn: They share the irregular stem of the future. Only the endings change.
    id: gs-31-2
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    title: Concept 2
    examples:
      - target: Exemple
        en: Example
exercises:
