id: gl-32
title: El Primer Condicional
subtitle: Probable o Real
grammarPoint: "Les oracions condicionals de primer tipus expressen accions
  probables o possibles. L'estructura més comuna és: Si + Present d'indicatiu,
  Futur simple (o Present o Imperatiu). La partícula 'si' introdueix la condició
  i mai va seguida de futur."
grammarPointEn: "First type conditional sentences express probable or possible
  actions. The most common structure is: Si + Present indicative, Future simple
  (or Present or Imperative). The particle 'si' introduces the condition and is
  never followed by the future tense."
slides:
  - slideId: gl-32-s-1
    content: |
      **Estructura del Primer Condicional**
      - **Condició:** *Si + Present d'Indicatiu*
      - **Conseqüència:** *Futur Simple* / *Present* / *Imperatiu*

      **Exemples:**
      - Si plou, **ens quedarem** a casa. (Futur)
      - Si tens gana, **menja** una poma. (Imperatiu)
      - Si fa bon temps, normalment **anem** a la platja. (Present)
    contentEn: "Structure of the First Conditional: If + Present Indicative ->
      Future Simple / Present / Imperative."
    id: gs-32-1
    body: Aquesta lliçó ensenya conceptes claus de gramàtica.
    title: Concept 1
    examples:
      - target: Exemple
        en: Example
exercises:
